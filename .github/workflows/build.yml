name: Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - run: chmod +x gradlew

      - name: Build
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          arguments: build
