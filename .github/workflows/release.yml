name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew distZip

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.GITHUB_REF_NAME }}
          files: build/distributions/MDC-Bot-*.zip
